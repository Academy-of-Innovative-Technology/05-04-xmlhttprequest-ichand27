<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="favoriteFood" placeholder="Favorite Food">
    <button id="submitBtn">submit</button>

    <script>
        let firstNameInput = document.querySelector("#firstName");
        let favoriteFoodInput = document.querySelector("#favoriteFood");
        let submitBtn = document.querySelector("#submitBtn");

        submitBtn.addEventListener("click", function() {
            let xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    console.log(JSON.parse(xhttp.responseText));
                }
            };

            let userData = {
                firstName: firstNameInput.value,
                favoriteFood: favoriteFoodInput.value
            };
            console.log(userData);

            let jsonString = JSON.stringify(userData);
            console.log(jsonString);

            xhttp.open("POST", "<Await URL Link>", true);
            xhttp.setRequestHeader("Content-Type", "application/json");

            xhttp.send(jsonString);
        });
    </script>
</body>
</html>
